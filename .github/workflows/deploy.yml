name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Workspace to publish: "placeholder" (Astro) or "site" (Angular).
  # Set the repository variable PUBLISH_APP to "site" to cut over.
  PUBLISH_APP: ${{ vars.PUBLISH_APP || 'placeholder' }}
  # Same as nodeLinker in .yarnrc.yml; Angular and Astro need a real node_modules folder.
  YARN_NODE_LINKER: node-modules

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Corepack must be enabled and pinned to the exact Yarn version before setup-node's
      # yarn cache lookup runs, or that lookup can invoke a different yarn first.
      - run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      # Run from inside the workspace rather than `yarn workspace <name> build`: that command
      # needs a lookup file Yarn doesn't reliably write under --immutable + node-modules linker,
      # and fails with "Couldn't find the node_modules state file".
      - run: yarn build
        working-directory: apps/${{ env.PUBLISH_APP }}

      - name: Prepare output
        run: |
          if [ "$PUBLISH_APP" = "site" ]; then
            OUT=apps/site/dist/site/browser
            # Pages has no SPA rewrites; 404.html serves the app for deep links.
            cp "$OUT/index.html" "$OUT/404.html"
          else
            OUT=apps/placeholder/dist
          fi
          touch "$OUT/.nojekyll"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
